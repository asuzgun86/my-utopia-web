<style>
/* Layout: phone-first crew app — PIN login, sticky top bar, scrolling content, fixed bottom tab bar; manager tab for editors */

  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1720; --surface:#16232f; --fg:#e6edf2; --muted:#93a6b5; --line:#263646;
  --sea:#1d5a85; --sea-ink:#ffffff; --brass:#d9a85a; --brass-soft:#3a2f1c;
  --alert:#ef7a66; --alert-soft:#3d2320; --ok:#5cc28c; --ok-soft:#1b3427; --warn:#e3a93c; --warn-soft:#3a2f17;
  --band-gold:#d9a84e; --band-gold-soft:#3a2f1c; --band-yellow:#5cc28c; --band-yellow-soft:#1b3427; --band-yellow-ink:#5cc28c; --band-red:#ef7a66; --band-red-soft:#3d2320; color-scheme:dark}}
:root[data-theme="dark"]{

  --sea:#1d5a85; --sea-ink:#ffffff; --brass:#d9a85a; --brass-soft:#3a2f1c;
  --alert:#ef7a66; --alert-soft:#3d2320; --ok:#5cc28c; --ok-soft:#1b3427; --warn:#e3a93c; --warn-soft:#3a2f17;
  --band-gold:#d9a84e; --band-gold-soft:#3a2f1c; --band-yellow:#5cc28c; --band-yellow-soft:#1b3427; --band-yellow-ink:#5cc28c; --band-red:#ef7a66; --band-red-soft:#3d2320; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}

.pop{max-height:90vh;overflow:auto}

.chart{width:100%;height:auto;display:block;overflow:visible}

.rgold{color:var(--band-gold)!important} .ryellow{color:var(--band-yellow-ink)!important} .rred{color:var(--band-red)!important}

@media (prefers-reduced-motion:reduce){.bday .confetti{display:none}}
.drop{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;display:grid;gap:8px;justify-items:center}
.drop.over{border-color:var(--sea);background:var(--brass-soft)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;background:var(--sea);color:var(--sea-ink)}
.btn.sec{background:var(--bg);color:var(--fg);border:1.5px solid var(--line)}

.filelist{display:grid;gap:8px}

.toggle{display:flex;gap:10px;align-items:flex-start}
.toggle input{width:20px;height:20px;margin-top:2px;flex:none}
.tbl-wrap{overflow-x:auto}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sp-media img{width:100%;border-radius:12px;display:block}.sp-media video{width:100%;max-height:72vh;border-radius:12px;background:#000}

<script>
/* Waiter Station importers.
   Each function takes {sheetName: rows[][]} (rows as arrays, like SheetJS sheet_to_json header:1)
   and returns plain data. Shared by the manager page (browser) and offline tests (node). */
const IMP = (() => {
  const num = v => (v === null || v === undefined || v === '' ? null : (typeof v === 'number' ? v : (isFinite(+v) ? +v : null)));
  const id6 = v => { const n = num(v); return n && n >= 1000 ? String(Math.round(n)).padStart(6, '0') : null; };
  const str = v => (v === null || v === undefined ? '' : String(v).trim());
  const iso = v => {
    if (!v) return '';
    if (v instanceof Date) return v.toISOString().slice(0, 10);
    if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 86400000)); return d.toISOString().slice(0, 10); }
    return String(v).slice(0, 10);
  };
  const nice = n => str(n).split(',').map(s => s.trim()).reverse().join(' ').toLowerCase().replace(/(^|[\s'-])\S/g, c => c.toUpperCase());
  const findSheet = (wb, re) => Object.keys(wb).find(k => re.test(k));

  /* ---------- Station Assignment (e.g. 258_Station_Assignment_v.8.0.xlsm) ---------- */
  function station(wb) {
    const wS = findSheet(wb, /^(Tab-\d+\.\s*)?Waiter Stn Print/i);
    const aS = findSheet(wb, /AsstWaiter Stn Print/i);
    const hS = findSheet(wb, /Headwaiter Station/i);
    if (!wS || !aS || !hS) throw new Error('Station Assignment file is missing the Waiter Stn Print, AsstWaiter Stn Print or Headwaiter Station sheet.');
    let voyage = '', date = '';
    for (const r of wb[wS].slice(0, 6)) {
      const i = r.findIndex(c => /VOYAGE/i.test(str(c)));
      if (i >= 0) { voyage = str(r.slice(i + 1).find(c => num(c))); const di = r.findIndex(c => /DATE/i.test(str(c))); if (di >= 0) date = iso(r.slice(di + 1).find(c => c)); }
    }
    const people = (rows, role) => rows.slice(4).map(r => {
      const id = id6(r[0]); if (!id || !str(r[2])) return null;
      const tables = r.slice(5, 17).map(num).filter(Boolean);
      return { id, k: str(r[1]), name: nice(r[2]), role, cap: num(r[3]), rating: num(r[4]), tables, stn: num(r[17]), venue: str(r[18]) };
    }).filter(Boolean);
    const waiters = people(wb[wS], 'Waiter'), asst = people(wb[aS], 'Assistant Waiter');
    const hws = wb[hS].slice(1).map(r => {
      const id = id6(r[0]); if (!id || !str(r[2])) return null;
      return { id, k: str(r[1]), name: nice(r[2]), role: 'Head Waiter', deck: str(r[3]), stnNo: num(r[4]), seats: num(r[5]), tables: r.slice(6).map(num).filter(Boolean) };
    }).filter(Boolean);
    return { voyage, date, waiters, asst, hws };
  }

  /* ---------- Gratuity Distribution (e.g. 256_Restaurant_Gratuity_Distribution_v.8.3.xlsm) ---------- */
  function grats(wb, filename) {
    const dS = findSheet(wb, /Main Grats Distribution/i), sS = findSheet(wb, /Server Sales Summary/i), vS = findSheet(wb, /Voyage Results/i);
    if (!dS) throw new Error('Gratuity file is missing the "Main Grats Distribution" sheet.');
    const voyage = (str(filename).match(/(^|[^\d])(\d{3})[_\s]/) || [])[2] || '';
    const pay = {}; const leaders = [];
    for (const r of wb[dS].slice(2)) {
      const id = id6(r[6]); const pos = str(r[4]);
      if (id && /^(ROM|MD|AMD)$/.test(pos) && str(r[5]) && !leaders.some(l => l.id === id)) leaders.push({ id, pos, name: nice(r[5]) });
      if (!id || !/^(W|WA|HW)$/.test(pos) || !str(r[5])) continue;
      if (pay[id]) continue; // left block is authoritative
      pay[id] = { pos, days: num(r[7]), seats: num(r[12]), bonusSeats: num(r[11]), mainPool: num(r[13]), ohsPool: num(r[14]), bev: num(r[25]), ind: num(r[26]), total: num(r[27]) };
    }
    const sales = {};
    if (sS) for (const r of wb[sS].slice(1)) {
      const id = id6(r[4]); if (!id || !/Waiter|Head Waiter/i.test(str(r[3]))) continue;
      const s = sales[id] || (sales[id] = { job: str(r[3]), rev: 0, disc: 0, grat: 0, tip: 0, checks: 0, covers: 0 });
      s.rev += num(r[6]) || 0; s.disc += num(r[7]) || 0; s.grat += num(r[8]) || 0; s.tip += num(r[9]) || 0; s.checks += num(r[12]) || 0; s.covers += num(r[13]) || 0;
    }
    const targets = {};
    if (vS) for (const r of wb[vS]) {
      const k = str(r[1]), t = num(r[2]), a = num(r[3]);
      if (k && t !== null && a !== null && !/^KPI$/i.test(k)) targets[k] = { target: t, achieved: a };
    }
    return { voyage, pay, sales, targets, leaders };
  }

  /* ---------- Missing / Expired TLC report ---------- */
  function tlc(wb) {
    const s = findSheet(wb, /^Data$/i) || Object.keys(wb)[0];
    const rows = wb[s]; let date = '', hdr = -1;
    rows.slice(0, 15).forEach((r, i) => { if (/DATE/i.test(str(r[0]))) date = iso(r[1]); if (/CREW ID/i.test(str(r[0]))) hdr = i; });
    if (hdr < 0) throw new Error('TLC report: could not find the "CREW ID#" header row.');
    const items = {};
    for (const r of rows.slice(hdr + 1)) {
      const id = id6(r[0]); if (!id || !str(r[7])) continue;
      (items[id] || (items[id] = [])).push({ code: str(r[7]), name: str(r[8]), status: str(r[9]) || str(r[25]), exp: iso(r[10]), rclu: str(r[6]) });
    }
    return { date, items };
  }


  /* ---------- Dining manifest (XDINING housekeeping report) ---------- */
  function manifest(wb) {
    const s = Object.keys(wb).find(k => wb[k].slice(0, 12).some(r => r && r.some(c => /^AD Table$/i.test(str(c)))));
    if (!s) throw new Error('Dining manifest: could not find the "AD Table" column.');
    const rows = wb[s]; const h = rows.findIndex(r => r && r.some(c => /^AD Table$/i.test(str(c))));
    const H = rows[h].map(c => str(c).toLowerCase());
    const col = name => H.findIndex(x => x === name.toLowerCase());
    const C = { cabin: col('Cabin'), guest: col('Guest'), title: col('Title (Salutation)'), age: col('Age'), asg: col('Assignment'), venue: col('AD Venue'), table: col('AD Table'), party: col('Party (Party ID)'), ptype: col('Party Type'), req: col('Request') };
    let voyage = ''; rows.slice(0, h).forEach(r => { if (/^Voyage$/i.test(str(r && r[0]))) voyage = str(r[1]); });
    const EV = { ANNV: 'Anniversary', BRTH: 'Birthday', HNYM: 'Honeymoon', HHM: 'Honeymoon', ENGT: 'Engagement', GRAD: 'Graduation', REIT: 'Retirement', REUN: 'Reunion', HB: 'Birthday' };
    const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const DIET = { 'NO GLUTEN': 'No gluten', 'GLUTEN FREE': 'Gluten free', 'HALAL': 'Halal', 'KOSHER': 'Kosher', 'INDIAN VEG': 'Indian vegetarian', 'LOW SODIUM': 'Low sodium', 'VEGAN': 'Vegan', 'PUREE FOOD': 'Puréed food', 'LACTO INTO': 'Lactose intolerant', 'LACTO/GLTN': 'No lactose / gluten', 'DAIRY/GLUT': 'No dairy / gluten', 'NO SHELFSH': 'No shellfish', 'NO SHELLFI': 'No shellfish', 'NO CILANTR': 'No cilantro', 'NO RASPBER': 'No raspberry' };
    const tables = {}; let n = 0, ev = 0, dt = 0;
    for (const r of rows.slice(h + 1)) {
      if (!r || !str(r[C.cabin])) continue;
      const t = num(r[C.table]); if (!t) continue;
      const req = str(r[C.req]).replace(/\r/g, '').split('\n').map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean);
      const events = [], diets = []; let udp = false;
      for (const q of req) {
        if (/^EVENTS\b/.test(q)) {
          const m = q.match(/\b(ANNV|BRTH|HNYM|HHM|ENGT|GRAD|REIT|REUN|HB)\b/); if (!m || /UNUSED/.test(q)) continue;
          const yrs = (q.slice(0, m.index).match(/(\d{1,2})\s*$/) || [])[1];
          const d = q.match(/(\d{4})-(\d{2})-(\d{2})/) || q.match(/(20\d{2})(\d{2})(\d{2})\b/);
          const label = EV[m[1]] + (yrs && +yrs > 0 ? (m[1] === 'ANNV' ? ` · ${+yrs} yrs` : m[1] === 'BRTH' || m[1] === 'HB' ? ` · turns ${+yrs}` : '') : '') + (d ? ` · ${+d[3]} ${MON[+d[2] - 1]}` : '');
          if (!events.includes(label)) events.push(label);
        } else if (/^DIET\b/.test(q)) {
          let x = q.replace(/^DIET\s+/, '').replace(/\s*SPML\s*$/, '').replace(/^DIET\s*/, '').trim();
          if (!x || /^HIST|^\d+$|^Y$/.test(x)) continue;
          x = DIET[x] || x.charAt(0) + x.slice(1).toLowerCase().replace(/\bno\b/g, 'no');
          if (!diets.includes(x)) diets.push(x);
        } else if (/UNLIMITED DINING PACKAGE/.test(q)) udp = true;
      }
      const ptype = str(r[C.ptype]).toUpperCase();
      const tier = /PINNACLE/.test(ptype) ? 'Pinnacle' : /DIAMOND PLUS/.test(ptype) ? 'Diamond Plus' : /DIAMOND/.test(ptype) ? 'Diamond' : '';
      const age = num(r[C.age]);
      const g = { n: nice(r[C.guest]), t: str(r[C.title]) ? str(r[C.title]).charAt(0) + str(r[C.title]).slice(1).toLowerCase() : '', c: str(r[C.cabin]), s: str(r[C.asg]), p: str(r[C.party]) };
      if (age !== null && age < 13) g.k = 1;
      if (tier) g.tier = tier; if (events.length) { g.ev = events; ev++; } if (diets.length) { g.d = diets; dt++; } if (udp) g.udp = 1;
      (tables[t] || (tables[t] = [])).push(g); n++;
    }
    return { voyage, guests: n, withEvents: ev, withDiet: dt, tables };
  }

  /* ---------- Crew birthdays (Master.xlsm, sheet with "Employee No." + "Birth Date") ---------- */
  function birthdays(wb) {
    const s = Object.keys(wb).find(k => wb[k].slice(0, 5).some(r => r && r.some(c => /^Birth Date$/i.test(str(c)))));
    if (!s) throw new Error('Crew master: could not find the "Birth Date" column.');
    const rows = wb[s]; const h = rows.findIndex(r => r && r.some(c => /^Birth Date$/i.test(str(c))));
    const H = rows[h].map(c => str(c).toLowerCase());
    const ci = H.findIndex(x => /^employee no/.test(x)), ni = H.findIndex(x => x === 'name'), bi = H.findIndex(x => x === 'birth date');
    const out = {};
    for (const r of rows.slice(h + 1)) {
      const id = id6(r[ci]); const b = r[bi]; if (!id || !b) continue;
      const d = iso(b); if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
      out[id] = { md: d.slice(5), name: nice(r[ni]) }; // month-day only, no year
    }
    return { count: Object.keys(out).length, crew: out };
  }

  /* ---------- 8-cruise average (8_Cruise_Average_xxx.xlsm) ---------- */
  function avg8(wb) {
    const sheets = Object.keys(wb).filter(k => /^(Waiter|WA MDR|HW) Service Rating$/i.test(k.trim()));
    if (!sheets.length) throw new Error('8-cruise file: could not find the Waiter / WA MDR / HW "Service Rating" sheets.');
    const crew = {}; const targets = {};
    for (const sh of sheets) {
      const rows = wb[sh];
      const vr = rows.findIndex(r => r && num(r[12]) && num(r[12]) > 100 && num(r[14]) > 100);
      const hr = rows.findIndex((r, i) => i > vr && r && /^ID$/i.test(str(r[9])));
      if (vr < 0 || hr < 0) continue;
      const avgCol = rows[vr].findIndex(c => /^AVERAGE$/i.test(str(c)));
      const cols = []; for (let c = 12; c < (avgCol > 0 ? avgCol : 30); c += 2) { const v = num(rows[vr][c]); if (v && v > 100) cols.push([c, v]); }
      const trow = rows[vr - 1] || [];
      cols.forEach(([c, v]) => { if (num(trow[c])) targets[v] = { svc: num(trow[c]), food: num(trow[c + 1]) }; });
      for (const r of rows.slice(hr + 1)) {
        const id = id6(r && r[9]); if (!id || !str(r[11])) continue;
        const hist = cols.map(([c, v]) => [v, num(r[c]), num(r[c + 1])]).filter(h => h[1] !== null || h[2] !== null);
        const sa = num(r[avgCol]), fa = num(r[avgCol + 1]);
        if (!hist.length && sa === null) continue;
        crew[id] = { svc: sa !== null ? Math.round(sa * 100) / 100 : null, food: fa !== null ? Math.round(fa * 100) / 100 : null, hist, k: str(r[10]) };
      }
    }
    const fts = Object.values(targets).map(t => t.food).filter(Boolean);
    return { count: Object.keys(crew).length, targets, foodTarget: fts.length ? Math.round(fts.reduce((a, b) => a + b, 0) / fts.length * 10) / 10 : null, crew };
  }

  /* ---------- Waiter Daily Sales (xxx_Waiter_Daily_SaleS.xlsm) ---------- */
  function sales(wb, filename) {
    const rS = Object.keys(wb).find(k => /^ROM$/i.test(k.trim())), mS = Object.keys(wb).find(k => /^Main$/i.test(k.trim()));
    if (!rS) throw new Error('Waiter sales file: could not find the "ROM" sheet.');
    const voyage = (str(filename).match(/(\d{3})_Waiter/i) || str(filename).match(/(^|[^\d])(\d{3})[_\s]/) || [])[1] || (str(filename).match(/(\d{3})/) || [])[1] || '';
    const rows = wb[rS]; const h = rows.findIndex(r => r && /^ID#?$/i.test(str(r[0])));
    const H = rows[h].map(c => str(c).toLowerCase());
    const ci = n => H.findIndex(x => x.startsWith(n));
    const C = { cnt: ci('sip tour count'), sip: ci('sip & tour'), prem: ci('premium'), spl: ci('specialty'), tot: ci('total') };
    const out = {};
    for (const r of rows.slice(h + 1)) {
      const id = id6(r[0]); if (!id || !str(r[1])) continue;
      out[id] = { t: num(r[C.tot]) || 0, p: num(r[C.prem]) || 0, s: num(r[C.spl]) || 0, st: num(r[C.sip]) || 0, n: num(r[C.cnt]) || 0 };
    }
    if (mS) {
      const m = wb[mS]; const mh = m.findIndex(r => r && /^ID#?$/i.test(str(r[0])));
      if (mh >= 0) {
        const dayCols = m[mh].map((c, i) => /^Day\s*\d+/i.test(str(c)) ? i : -1).filter(i => i >= 0);
        for (const r of m.slice(mh + 1)) { const id = id6(r[0]); if (id && out[id]) out[id].d = dayCols.map(i => Math.round((num(r[i]) || 0) * 100) / 100); }
      }
    }
    const hS = Object.keys(wb).find(k => /^HW Sales$/i.test(k.trim())); const hw = {};
    if (hS) { const m = wb[hS]; const hh = m.findIndex(r => r && /^ID#?$/i.test(str(r[0])) && r.some(c => /HW Name/i.test(str(c))));
      if (hh >= 0) { const H2 = m[hh].map(c => str(c).toLowerCase()); const ts = H2.findIndex(x => x === 'total sales'), tt = ts >= 0 ? ts : H2.findIndex(x => x === 'total'), tg = H2.findIndex(x => x === 'target'), dk = H2.findIndex(x => /^deck/.test(x));
        const dayCols = H2.map((c, i) => /^day\s*\d+/.test(c) ? i : -1).filter(i => i >= 0);
        for (const r of m.slice(hh + 1)) { const id = id6(r[0]); if (!id || !str(r[1])) continue; hw[id] = { t: Math.round((num(r[tt]) || 0) * 100) / 100, tg: num(r[tg]), deck: str(r[dk]), d: dayCols.map(i => Math.round((num(r[i]) || 0) * 100) / 100) }; } } }
    for (const v of Object.values(out)) for (const k of ['t', 'p', 's', 'st']) v[k] = Math.round(v[k] * 100) / 100;
    const total = Object.values(out).reduce((a, b) => a + b.t, 0);
    return { voyage, waiters: Object.keys(out).length, total: Math.round(total), crew: out, hw };
  }
  /* ---------- Combine into one crew directory ---------- */
  function build(parts) {
    const st = parts.station || { waiters: [], asst: [], hws: [] };
    const gr = parts.grats || { pay: {}, sales: {}, targets: {} };
    const tl = parts.tlc || { items: {} };
    const crew = {};
    const hwOf = t => st.hws.find(h => h.tables.includes(t));
    const add = p => {
      const hw = p.tables.length ? hwOf(p.tables[0]) : null;
      crew[p.id] = { ...p, hw: hw ? { id: hw.id, name: hw.name } : null, partners: [] };
    };
    st.waiters.forEach(add); st.asst.forEach(add);
    st.hws.forEach(h => { crew[h.id] = { ...h, venue: h.deck, partners: [] }; });
    // waiter <-> assistant waiter by shared tables
    for (const w of st.waiters) for (const a of st.asst) {
      if (w.tables.some(t => a.tables.includes(t))) {
        crew[w.id].partners.push({ id: a.id, name: a.name, role: 'Assistant Waiter' });
        crew[a.id].partners.push({ id: w.id, name: w.name, role: 'Waiter' });
      }
    }
    // rating rank among waiters
    const ranked = st.waiters.filter(w => w.rating !== null).sort((a, b) => b.rating - a.rating);
    ranked.forEach(w => { crew[w.id].rank = 1 + ranked.filter(x => x.rating > w.rating).length; crew[w.id].rankOf = ranked.length; });
    const rankedA = st.asst.filter(w => w.rating !== null).sort((a, b) => b.rating - a.rating);
    rankedA.forEach(w => { crew[w.id].rank = 1 + rankedA.filter(x => x.rating > w.rating).length; crew[w.id].rankOf = rankedA.length; });
    // attach pay, sales and training to anyone we know (and add people found only in the pay file)
    for (const [id, p] of Object.entries(gr.pay)) { if (!crew[id] && /^(W|WA|HW)$/.test(p.pos)) crew[id] = { id, name: '', role: p.pos, tables: [], partners: [] }; if (crew[id]) crew[id].pay = p; }
    for (const [id, s] of Object.entries(gr.sales)) if (crew[id]) crew[id].sales = s;
    const LROLE = { ROM: 'Restaurant Operations Manager', MD: "Maitre d'", AMD: "Assistant Maitre d'" };
    for (const l of (gr.leaders || [])) { if (crew[l.id]) Object.assign(crew[l.id], { role: LROLE[l.pos] || l.pos, leader: true }); else crew[l.id] = { id: l.id, name: l.name, role: LROLE[l.pos] || l.pos, k: l.pos, tables: [], partners: [], leader: true }; }
    // station-sheet rows marked AMD/MD (no tables) are managers, not head waiters
    for (const c of Object.values(crew)) if (c.role === 'Head Waiter' && /^(AMD|MD)\b/i.test(c.k || '')) { c.role = /^MD/i.test(c.k) ? "Maitre d'" : "Assistant Maitre d'"; c.leader = true; }
    for (const [id, t] of Object.entries(tl.items)) if (crew[id]) crew[id].tlc = t;
    const mtd = Object.entries(gr.targets).find(([k]) => /My Time Dining Service Rating/i.test(k));
    const food = Object.entries(gr.targets).find(([k]) => /My Time Dining Food Quality/i.test(k));
    return {
      voyage: st.voyage, stationDate: st.date, payVoyage: gr.voyage, tlcDate: tl.date,
      shipKpi: { mtdRating: mtd ? mtd[1] : null, mtdFood: food ? food[1] : null },
      crew
    };
  }

  function summary(d) {
    const c = Object.values(d.crew);
    return {
      waiters: c.filter(x => x.role === 'Waiter').length, asst: c.filter(x => x.role === 'Assistant Waiter').length,
      hw: c.filter(x => x.role === 'Head Waiter').length, withPay: c.filter(x => x.pay).length,
      withTlcIssues: c.filter(x => x.tlc && x.tlc.length).length, tables: new Set(c.flatMap(x => x.role === 'Waiter' ? x.tables : [])).size
    };
  }
  return { station, grats, tlc, manifest, birthdays, avg8, sales, build, summary, _nice: nice };
})();


/* Cruise Compass text extraction. Input: pages = [{width, items:[{str, x, y}]}] where y grows downward.
   Output: {snapshot:{...}, highlights:[{title, where}]} */
const COMPASS = (() => {
  function lines(page) {
    const out = [];
    for (const side of [0, 1]) {
      const its = page.items.filter(i => i.str.trim() && (side ? i.x >= page.width / 2 : i.x < page.width / 2));
      const rows = new Map();
      for (const it of its) {
        const key = Math.round(it.y / 3);
        const k = rows.has(key) ? key : rows.has(key - 1) ? key - 1 : rows.has(key + 1) ? key + 1 : key;
        (rows.get(k) || rows.set(k, []).get(k)).push(it);
      }
      [...rows.entries()].sort((a, b) => a[0] - b[0]).forEach(([, r]) => {
        r.sort((a, b) => a.x - b.x);
        out.push({ side, text: r.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim() });
      });
    }
    return out;
  }
  const TIME = /(\d{1,2}(:\d{2})?\s*(am|pm)|midnight|noon)/i;
  const WHERE = /(Deck|Decks)\s*\d/i;
  function extract(pages) {
    const all = pages.map(lines);
    const flat = all.flat().map(l => l.text);
    const txt = flat.join('\n');
    const pick = re => { const m = txt.match(re); return m ? m[1].trim() : ''; };
    const snapshot = {
      day: pick(/DAY\s+(\d+)/i),
      where: pick(/DAY\s+\d+\s+([A-Za-z ,.'’-]+?)(?:\s+(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)|\n)/i),
      date: pick(/((?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),\s+[A-Za-z]+\s+\d{1,2},\s+\d{4})/i),
      forecast: pick(/Forecast\s+(.+?)\s+Temperature/i),
      temp: pick(/Temperature\s+([^\n]+?)(?:\s{2,}|\n|$)/i),
      sunrise: pick(/Sunrise\s+(\d{1,2}:\d{2}\s*[ap]m)/i),
      sunset: pick(/Sunset\s+(\d{1,2}:\d{2}\s*[ap]m)/i),
      dress: pick(/Dress Code\s+([A-Za-z ]+?)(?:\n|\s{2,}|$)/i),
      allAboard: pick(/All Aboard[^\d]{0,20}(\d{1,2}:\d{2}\s*[ap]m)/i)
    };
    const highlights = []; const seen = new Set();
    for (const page of all) {
      page.forEach((l, i) => {
        if (!(WHERE.test(l.text) && TIME.test(l.text)) || l.text.length > 110) return;
        // find a title above: nearest earlier line on the same side that looks like a heading
        let j = i - 1;
        while (j >= 0 && page[j].side === l.side && (/[.,!?]$/.test(page[j].text) || page[j].text.length > 62 || /^[a-z]/.test(page[j].text)) && !(WHERE.test(page[j].text) && TIME.test(page[j].text))) j--;
        let title = j >= 0 && page[j].side === l.side ? page[j].text : '';
        if (!title || (WHERE.test(title) && TIME.test(title)) || /^[a-z$]/.test(title)) return;
        const words = title.split(' ').filter(w => /[A-Za-z]/.test(w));
        if (words.length > 6 && words.filter(w => /^[A-Z0-9“"(]/.test(w)).length / words.length < 0.5) return;
        const half = title.split(' '); if (half.length % 2 === 0 && half.slice(0, half.length / 2).join(' ') === half.slice(half.length / 2).join(' ')) title = half.slice(0, half.length / 2).join(' ');
        const key = title + l.text; if (seen.has(key)) return; seen.add(key);
        highlights.push({ title, where: l.text });
      });
    }
    return { snapshot, highlights: highlights.slice(0, 40) };
  }
  return { extract, lines };
})();

function ratingChart(m,t){

  const cl=v=>Math.max(lo,v);

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Your rating ${m.rating.toFixed(1)}, team average ${team.toFixed(1)}${t!=null?', target '+t:''}">

function kpiAll(){
  if(_kpiCache&&_kpiCache.src===D.sales&&_kpiCache.a8===D.avg8) return _kpiCache;
  const res={src:D.sales,a8:D.avg8,crew:{},voyages:{}};
  if(!D.sales){ _kpiCache=res; return res; }
  for(const v of salesVoyages()){ const c=D.sales.voyages[v].crew; res.voyages[v]={p90:p90(Object.values(c).map(x=>x.t)),avg:avg(Object.values(c).map(x=>x.t))}; }
  const ids=new Set([...Object.keys(D.avg8?D.avg8.crew:{}),...salesVoyages().flatMap(v=>Object.keys(D.sales.voyages[v].crew))]);
  for(const id of ids){

    for(const v of salesVoyages()){
      const s=D.sales.voyages[v].crew[id]; const h=a?a.hist.find(x=>String(x[0])===v):null;
      if(!s&&!h) continue;
      const P=res.voyages[v].p90; const sc=s?(P?Math.min(100,100*s.t/P):0):null;
      const r=h?h[1]:null;
      rows.push({v,sales:s?s.t:null,s,salesScore:sc,rating:r,kpi:(r!=null&&sc!=null)?KPI_W_RATING*r+KPI_W_SALES*sc:null});
    }
    const done=rows.filter(x=>x.kpi!=null);
    res.crew[id]={rows,kpi:done.length?avg(done.map(x=>x.kpi)):null,n:done.length,totalSales:rows.reduce((t,x)=>t+(x.sales||0),0),avgSales:avg(rows.filter(x=>x.sales!=null&&x.rating!=null).map(x=>x.sales))};

function loadScript(src){ return new Promise((ok,bad)=>{ if(document.querySelector(`script[src="${src}"]`)) return ok(); const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>bad(new Error('Could not load '+src)); document.head.appendChild(s); }); }

const MG={files:[],parts:{},pdf:{},busy:false,msg:'',err:''};
const XLSXJS='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
async function readExcel(file){
  await loadScript(XLSXJS); const buf=await file.arrayBuffer();
  const names=XLSX.read(buf,{type:'array',bookSheets:true}).SheetNames;
  let want=names.filter(n=>/Waiter Stn Print|AsstWaiter Stn Print|Headwaiter Station|Main Grats Distribution|Server Sales Summary|Voyage Results|^Data$|Housekeeping Report|Manifest|^E1$|Service Rating$|^ROM$|^Main$|^POL Data$|^Master$|^HW Sales$|^(Anniversary|Birthday|Honeymoon|Graduation|Engagement|Retirement)/i.test(n));
  if(!want.length&&names.length<=3) want=names;
  if(!want.length) return {names, sheets:{}};
  const wb=XLSX.read(buf,{type:'array',sheets:want,cellDates:true});
  const sheets={}; for(const n of want) sheets[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});
  return {names, sheets};
}
async function readPdfPages(file){
  const lib=await pdfLib(); const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise; const pages=[];
  for(let n=1;n<=doc.numPages;n++){ const p=await doc.getPage(n); const vp=p.getViewport({scale:1}); const tc=await p.getTextContent();
    pages.push({width:vp.width,items:tc.items.map(i=>({str:i.str,x:i.transform[4],y:vp.height-i.transform[5]}))}); }
  return pages;
}

function spWaiters(v){
  const rows=spRows(v); if(!rows.length) return {W:[],vs:[]};
  const all=[...new Set(rows.map(r=>r.voy))].sort((a,b)=>a-b); const vs=spVoy?all.slice(-spVoy):all; const set=new Set(vs);
  const m=new Map(); rows.filter(r=>set.has(r.voy)).forEach(r=>{ const k=r.id+'|'+r.name; if(!m.has(k)) m.set(k,{id:r.id,name:r.name,v:[]}); m.get(k).v.push(r); });
  const avg=a=>{a=a.filter(x=>x!=null); return a.length?a.reduce((s,x)=>s+x,0)/a.length:null;};
  const W=[...m.values()].map(w=>{ w.v.sort((a,b)=>a.voy-b.voy); return {...w,n:w.v.length,kpi:avg(w.v.map(r=>r.kpi)),rating:avg(w.v.map(r=>r.rating)),res:avg(w.v.map(r=>r.res)),last:w.v[w.v.length-1]}; });
  const key={kpi:w=>w.kpi??-1,rating:w=>w.rating??-1,res:w=>w.res??-1,name:w=>w.name};
  const ranked=W.filter(w=>w.kpi!=null).sort((a,b)=>b.kpi-a.kpi); const cut=Math.max(1,Math.round(ranked.length*.2));
  ranked.forEach((w,i)=>{ w.rank=i+1; w.of=ranked.length; w.band=ranked.length>=5?(i<cut?'top':i>=ranked.length-cut?'bottom':''):''; });

  return {W,vs};
}

  let months=[...new Set(rows.map(r=>(r[6]||'').slice(0,7)).filter(Boolean))].sort(); const keep=months.slice(-6);
  const R2=rows.filter(r=>!r[6]||keep.includes(r[6].slice(0,7)));
  return {master:imp.master||(old&&old.master)||[],notes,rows:R2,months:keep,updated:new Date().toISOString().slice(0,10),source:'POL_TRACKING'};
}

/* ---------------- today: day, date, cruise day ---------------- */
function parseDateLoose(s){ if(!s) return null; const m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return new Date(+m[1],+m[2]-1,+m[3]); const d=new Date(String(s).replace(/^[A-Za-z]+,\s*/,'')); return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function todayInfo(){
  const now=new Date(), t=new Date(now.getFullYear(),now.getMonth(),now.getDate()), DAY=864e5;
  const starts=[]; const c=D.compass&&D.compass.snapshot;
  const cd=c&&parseDateLoose(c.date), cn=c&&parseInt(c.day,10);
  if(cd&&cn>0) starts.push({d:new Date(cd.getTime()-(cn-1)*DAY),src:'compass'});
  const sd=D.built&&parseDateLoose(D.built.stationDate); if(sd) starts.push({d:sd,src:'station'});
  const ok=starts.filter(s=>s.d<=t&&(t-s.d)/DAY<9).sort((a,b)=>b.d-a.d);
  const day=ok.length?Math.round((t-ok[0].d)/DAY)+1:null;
  const where=c&&cd&&cd.getTime()===t.getTime()?c.where:'';
  const date=now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return {date,day,where,voyage:D.built&&D.built.voyage};
}

/* ---------------- special meals + special occasions (merged into the dining manifest) ---------------- */
const GX=(()=>{
  const str=v=>v==null?'':String(v).trim();
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const toD=v=>{ if(v instanceof Date) return v; if(typeof v==='number'&&v>30000&&v<80000) return new Date(Math.round((v-25569)*864e5)); const m=str(v).match(/(\d{4})-(\d{2})-(\d{2})/); return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null; };
  const dm=d=>d?`${d.getUTCDate()} ${MON[d.getUTCMonth()]}`:'';
  const nice=n=>str(n).split(',').map(s=>s.trim()).reverse().join(' ').toLowerCase().replace(/(^|[\s'-])\S/g,c=>c.toUpperCase());
  const sur=n=>str(n).split(',')[0].trim().toLowerCase();
  function sm(wb){
    for(const k of Object.keys(wb)){ const rows=wb[k]; const h=rows.findIndex(r=>r&&r.some(c=>/^Special Remark$/i.test(str(c)))); if(h<0) continue;
      const H=rows[h].map(c=>str(c).toLowerCase()); const ci=x=>H.indexOf(x);
      const C={g:ci('guest'),c:ci('stateroom'),t:ci('table'),dk:ci('deck'),p:ci('dining preference'),r:ci('special remark'),d:ci('disability condition'),a:ci('accommodation')};
      let sail=''; rows.slice(0,h).forEach(r=>{ const m=str(r&&r[0]).match(/SAIL_DATE is ([\d/]+)/); if(m) sail=m[1]; });
      const out=rows.slice(h+1).filter(r=>r&&str(r[C.g])&&str(r[C.c])).map(r=>({c:str(r[C.c]),n:str(r[C.g]),t:str(r[C.t]),dk:str(r[C.dk]).replace(/\s+$/,''),p:str(r[C.p]),r:str(r[C.r]),d:str(r[C.d]),a:str(r[C.a])}));
      return {sail,rows:out};
    }
    throw new Error('Special meal file: could not find the "Special Remark" column.');
  }
  const TYPES=[[/^Anniv/i,'Anniversary'],[/^Birth/i,'Birthday'],[/^Honeymoon/i,'Honeymoon'],[/^Gradu/i,'Graduation'],[/^Engag/i,'Engagement'],[/^Retire/i,'Retirement']];
  function occ(wb){
    const out=[];
    for(const k of Object.keys(wb)){ const T=TYPES.find(([re])=>re.test(k.trim())); if(!T) continue; const rows=wb[k];
      const h=rows.findIndex(r=>r&&r.some(c=>/^STATEROOM$/i.test(str(c)))); if(h<0) continue;
      const H=rows[h].map(c=>str(c).toUpperCase()); const cc=H.indexOf('STATEROOM'), nn=H.findIndex(x=>/^NAME/.test(x)), yy=H.indexOf('YEAR'), dd=H.indexOf('DATE');
      for(const r of rows.slice(h+1)){ if(!r||!str(r[cc])||!str(r[nn])) continue; const d=toD(r[dd]); const y=yy>=0?parseInt(str(r[yy]),10):NaN;
        out.push({type:T[1],c:str(r[cc]),n:str(r[nn]),y:isFinite(y)&&y>0?y:null,md:d?dm(d):''}); }
    }
    if(!out.length&&!Object.keys(wb).some(k=>TYPES.some(([re])=>re.test(k.trim())))) throw new Error('Special occasion file: no Anniversary/Birthday/Honeymoon sheets found.');
    return {rows:out};
  }
  const label=o=>o.type+(o.y?(o.type==='Anniversary'?` · ${o.y} yrs`:o.type==='Birthday'?` · turns ${o.y}`:''):'')+(o.md?` · ${o.md}`:'');
  const ALG=/allerg|gluten|lactose|dairy|nut|shell|seafood|fish|corn|kiwi|strawb|pepper|pnut|glten/i;
  function merge(G,SM,OC){
    const out={...G,tables:{}}; delete out.unmatched;
    const idx={}; for(const [t,gs] of Object.entries(G.tables)){ out.tables[t]=gs.map(g=>{ const x={...g}; delete x.sm; delete x.acc; delete x.oc; return x; }); out.tables[t].forEach(g=>(idx[g.c]||(idx[g.c]=[])).push({g,t})); }
    const find=(c,n)=>{ const L=idx[str(c)]||[]; const s=sur(n), nn=nice(n).toLowerCase(); return L.find(x=>x.g.n.toLowerCase()===nn)||L.find(x=>x.g.n.toLowerCase().includes(s.split(' ')[0]))||null; };
    const um=[]; let nSm=0,nOc=0;
    for(const r of (SM&&SM.rows)||[]){
      if(/^CELEBRATE$/i.test(r.r)) continue;
      const hit=find(r.c,r.n); const txt=r.d||r.r; const isAlg=ALG.test(r.d||'')||/^NO /i.test(r.r)||/LACTO|GLTN|GLUTEN/i.test(r.r);
      if(hit){ hit.g.sm=txt; if(r.a&&!/^Please prepare/i.test(r.a)) hit.g.acc=r.a; if(isAlg){ const d=hit.g.d||(hit.g.d=[]); const K=x=>x.toLowerCase().replace(/allergic to|intolerant|intolerance|free|no |[^a-z]/g,'').slice(0,5); if(!d.some(x=>K(x)===K(txt))) d.push(txt); } nSm++; }
      else um.push({c:r.c,n:nice(r.n),t:r.t,dk:r.dk,p:r.p,txt,acc:r.a&&!/^Please prepare/i.test(r.a)?r.a:''});
    }
    for(const o of (OC&&OC.rows)||[]){
      const hit=find(o.c,o.n); if(!hit) continue; const ev=hit.g.ev||(hit.g.ev=[]);
      const lb=label(o); const same=ev.findIndex(e=>e.split(' · ')[0]===o.type);
      if(same<0){ ev.push(lb); nOc++; } else if(lb.length>ev[same].length){ ev[same]=lb; }
    }
    const all=Object.values(out.tables).flat();
    out.withEvents=all.filter(g=>g.ev&&g.ev.length).length; out.withDiet=all.filter(g=>g.d&&g.d.length).length;
    out.special={sail:SM&&SM.sail||'',matched:nSm,unmatched:um}; out.smRaw=SM||null; out.occRaw=OC||null; out.occAdded=nOc;
    return out;
  }
  return {sm,occ,merge};
})();

/* ---------------- head waiter dashboard: revenue + rating, last 8 cruises ---------------- */
function hwSeries(id){
  const a=D.avg8&&D.avg8.crew&&D.avg8.crew[id]; const T=(D.avg8&&D.avg8.targets)||{}; const SV=(D.sales&&D.sales.voyages)||{};
  const vs=new Set(); (a&&a.hist||[]).forEach(h=>vs.add(String(h[0]))); Object.keys(SV).forEach(v=>{ if(SV[v].hw&&SV[v].hw[id]) vs.add(v); });
  return [...vs].sort((x,y)=>+x-+y).slice(-8).map(v=>{ const h=(a&&a.hist||[]).find(x=>String(x[0])===v); const s=SV[v]&&SV[v].hw&&SV[v].hw[id];
    return {v, svc:h&&h[1]?h[1]:null, food:h&&h[2]?h[2]:null, st:T[v]&&T[v].svc, ft:T[v]&&T[v].food, rev:s?s.t:null, rt:s?s.tg:null}; });
}
const mean=a=>{a=a.filter(x=>x!=null); return a.length?a.reduce((s,x)=>s+x,0)/a.length:null;};
function colChart(rows,key,tKey,fmt,cls,lo){
  const vals=rows.map(r=>r[key]).filter(x=>x!=null); if(!vals.length) return '<div class="note">No data yet.</div>';
  const ts=rows.map(r=>r[tKey]).filter(x=>x!=null);
  const W=340,H=156,P={l:6,r:6,t:24,b:22}; const n=rows.length, bw=(W-P.l-P.r)/n;
  const min=lo!=null?lo:0, max=Math.max(...vals,...ts)*(lo!=null?1.004:1.12); const y=v=>P.t+(H-P.t-P.b)*(1-(v-min)/(max-min||1));
  let g=''; rows.forEach((r,i)=>{ const x=P.l+i*bw+bw*.16, w=bw*.68; const v=r[key];
    if(v!=null){ const yy=Math.min(y(v),H-P.b-2); g+=`<rect x="${x}" y="${yy}" width="${w}" height="${H-P.b-yy}" rx="3" class="${cls(r)}"/><text x="${x+w/2}" y="${yy-4}" text-anchor="middle" class="lbl">${fmt(v)}</text>`; }
    if(r[tKey]!=null) g+=`<line x1="${x-bw*.1}" x2="${x+w+bw*.1}" y1="${y(r[tKey])}" y2="${y(r[tKey])}" class="tline"/>`;
    g+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${r.v}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(key)} by voyage">${g}</svg>`;
}
let hwView='svc', hwN=8, hwSel=null;
function hwAllStats(){ // per voyage: average + ranking across all head waiters

  const ids=Object.values((D.built&&D.built.crew)||{}).filter(c=>c.role==='Head Waiter').map(c=>c.id); const by={};
  ids.forEach(id=>hwSeries(id).forEach(r=>{ const o=by[r.v]||(by[r.v]={svc:[],rev:[],food:[]}); if(r.svc!=null)o.svc.push([id,r.svc]); if(r.rev!=null)o.rev.push([id,r.rev]); if(r.food!=null)o.food.push([id,r.food]); }));

function hwRank(v,key,id){ const L=((hwAllStats()[v]||{})[key]||[]).slice().sort((a,b)=>b[1]-a[1]); const i=L.findIndex(x=>x[0]===id); return i<0?null:{r:i+1,of:L.length}; }
function hwAvg(v,key){ return mean(((hwAllStats()[v]||{})[key]||[]).map(x=>x[1])); }

  if(path) g+=`<path d="${path}" fill="none" stroke="var(--fg)" stroke-width="1.6" stroke-dasharray="2 4" opacity=".55" pointer-events="none"/>`;
  return `<svg class="chart hwc" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(key)} by voyage">${g}</svg>
   <div class="legend">${isRev?'<span><i style="background:var(--ok)"></i>Target hit</span><span><i style="background:var(--warn)"></i>Below target</span>':key==='food'?'<span><i style="background:var(--ok)"></i>On target</span><span><i style="background:var(--warn)"></i>Below target</span>':'<span><i style="background:var(--band-gold)"></i>Gold 97.5+</span><span><i style="background:var(--band-yellow)"></i>Green 97.0–97.4</span><span><i style="background:var(--band-red)"></i>Red &lt;97</span>'}<span><i style="background:var(--alert);height:3px"></i>Target</span><span><i style="background:var(--fg);opacity:.5;height:3px"></i>All head waiters avg</span></div>`;
}

   <div class="note">Service and food from the 8-cruise average file; revenue from the HW Sales sheet. Tap the boxes to switch the chart.</div></div>`;
}
function hwSpark(id){ const R=hwSeries(id).slice(-8).filter(r=>r.svc!=null); if(R.length<2) return ''; const v=R.map(r=>r.svc), mn=Math.min(...v)-.3, mx=Math.max(...v)+.3; const pts=v.map((x,i)=>`${(i/(v.length-1))*60},${18-((x-mn)/(mx-mn||1))*16}`).join(' '); return `<svg width="60" height="20" viewBox="0 0 60 20" style="vertical-align:middle"><polyline points="${pts}" fill="none" stroke="var(--sea)" stroke-width="1.6"/></svg>`; }
let hwSort='svc';
function hwTableCard(){
  const hws=Object.values((D.built&&D.built.crew)||{}).filter(c=>c.role==='Head Waiter'); if(!hws.length) return '';
  const L=hws.map(h=>{ const R=hwSeries(h.id); return {h,n:R.length,svc:mean(R.map(r=>r.svc)),rev:mean(R.map(r=>r.rev)),ls:[...R].reverse().find(r=>r.svc!=null),lr:[...R].reverse().find(r=>r.rev!=null),hit:R.filter(r=>r.rev!=null&&r.rt!=null&&r.rev>=r.rt).length,nr:R.filter(r=>r.rev!=null).length}; }).filter(o=>o.n);
  if(!L.length) return '';
  L.sort((a,b)=>hwSort==='rev'?(b.rev??-1)-(a.rev??-1):hwSort==='name'?a.h.name.localeCompare(b.h.name):(b.svc??-1)-(a.svc??-1));
  return `<div class="card" style="border-color:var(--sea)"><div class="head-row"><h2>Head waiter dashboard</h2><span class="note">Last 8 cruises · tap a name for charts</span></div>
   <div class="chips"><span class="eyebrow" style="align-self:center">Sort</span>${[['svc','Rating'],['rev','Revenue'],['name','Name']].map(([k,l])=>`<button class="chip" data-hwsort="${k}" aria-pressed="${hwSort===k}">${l}</button>`).join('')}</div>
   <div class="tbl-wrap"><table class="mini"><thead><tr><th>Head waiter</th><th>Avg rating</th><th>Avg revenue</th><th>Target hit</th><th>Trend</th><th>Latest</th></tr></thead><tbody>
   ${L.map(o=>`<tr data-crew="${esc(o.h.id)}" tabindex="0" style="cursor:pointer"><td style="white-space:normal;min-width:130px">${esc(o.h.name)}<br><small class="note">${esc(o.h.deck||'')} · stn ${esc(o.h.stnNo||'')}</small></td><td class="${o.svc!=null?(o.svc>=97.5?'rgold':o.svc>=97?'ryellow':'rred'):''}"><b>${o.svc!=null?o.svc.toFixed(2):'—'}</b></td><td>${o.rev!=null?usd(o.rev):'—'}</td><td>${o.nr?o.hit+'/'+o.nr:'—'}</td><td>${hwSpark(o.h.id)}</td><td>${o.ls?o.ls.svc.toFixed(1)+' <small class="note">('+o.ls.v+')</small>':'—'}<br>${o.lr?usd(o.lr.rev)+' <small class="note">('+o.lr.v+')</small>':''}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ---------------- Cruise Compass: one per day, today's picked automatically ---------------- */
const isoToday=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function pickCompass(date){
  const L=(D.compassdays&&D.compassdays.days)||[]; if(!L.length) return;
  const t=date||isoToday(); const e=L.find(x=>x.date===t)||[...L].reverse().find(x=>x.date<=t)||L[0];
  D.compass=e.c; D.compassSel=e.date; D.meta.files={...(D.meta.files||{}),compass:{name:e.name,pages:e.pages,path:e.path}}; pdfOpen.compass=false;
}
function compassDayChips(){
  const L=(D.compassdays&&D.compassdays.days)||[]; if(L.length<2) return '';
  const fmt=d=>{ const x=new Date(d+'T12:00:00'); return x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); };
  return `<div class="chips">${L.map(e=>`<button class="chip" data-cday="${e.date}" aria-pressed="${D.compassSel===e.date}">Day ${esc(e.c.snapshot.day||'')} · ${esc(fmt(e.date))}${e.date===isoToday()?' · today':''}</button>`).join('')}</div>`;
}

/* ---------------- Guest Risk Analysis page (risk.html; Head Waiters and managers) ---------------- */
function vRiskPage(){
  if(!canSeeTeam()) return '<div class="card"><p class="note">The Guest Risk Analysis is for Head Waiters and managers.</p></div>';

    else f.src='risk.html';
  },0);

}

/* ---------------- render & events ---------------- */
function render(){
  drawTabs(); drawDayLine();
  const v={section:vSection,guests:vGuests,kpi:()=>vKpi(false),crew:vCrew,menu:vMenu,specialty:vSpecialty,pol:vPol,compass:vCompass,me:vMe,manager:vManager,heatmap:vHeatmap,risk:vRiskPage}[tab];
  $('view').innerHTML=(me||['menu','compass','manager','specialty','pol','heatmap','risk'].includes(tab))?((tab==='section'&&me?todayCard()+(me.role==='Head Waiter'?hwDashCard(meId):isLeader(me)?hwTableCard():''):'')+v()):'';
  if(tab==='manager') wireManager();
  for(const k of Object.keys(pdfOpen)) if(pdfOpen[k]&&tab==='compass') renderPdf(k);
}
function wireManager(){
  const drop=$('drop'), inp=$('fileIn'); if(!drop) return;
  inp.onchange=()=>{ if(inp.files.length) handleFiles([...inp.files]); inp.value=''; };
  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')}; drop.ondragleave=()=>drop.classList.remove('over');
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over'); if(e.dataTransfer.files.length) handleFiles([...e.dataTransfer.files]);};
  $('lookId').oninput=e=>lookup(e.target.value.trim());
  const sf=$('spUpF'); if(sf) sf.onchange=()=>{ if(sf.files.length) spUpload(sf.files[0]); sf.value=''; };
  ['spUpV','spUpK'].forEach(id=>{ const el=$(id); if(el) el.onchange=()=>{ spUp={key:$('spUpV').value,kind:$('spUpK').value}; }; });
}
document.addEventListener('click',e=>{
  const tr=e.target.closest('tr[data-crew]'); if(tr) return openCrew(tr.dataset.crew);
  const ptr=e.target.closest('tr[data-polsel]'); if(ptr){ polSel=ptr.dataset.polsel; render(); const d=document.querySelector('.notes-l'); if(d) d.closest('.card').scrollIntoView({block:'start'}); return; }
  const hv=e.target.closest('rect[data-hwv]'); if(hv){ hwSel=hwSel===hv.dataset.hwv?null:hv.dataset.hwv; const y=scrollY; render(); scrollTo(0,y); return; }
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.k!==undefined) return press(b.dataset.k);
  if(b.id==='back'){firstPin='';return setStep('id',null);}
  if(b.id==='logout') return logout();
  if(b.id==='mgrEnter') return openManager();
  if(b.dataset.tab){ tab=b.dataset.tab; window.scrollTo(0,0); return render(); }
  if(b.dataset.gotomenu){ mNight=+b.dataset.gotomenu; tab='menu'; window.scrollTo(0,0); return render(); }
  if(b.dataset.part){ mPart=b.dataset.part; return render(); }
  if(b.dataset.al){ alF=alF===b.dataset.al?'':b.dataset.al; return render(); }
  if(b.dataset.wf){ const v=b.dataset.wf; if(v.startsWith('group:')) wF.group=v.slice(6); else wF[v]=!wF[v]; return render(); }
  if(b.dataset.pdf){ const k=b.dataset.pdf; pdfOpen[k]=!pdfOpen[k]; return render(); }
  if(b.dataset.gf){ gF=b.dataset.gf; return render(); }
  if(b.dataset.gmode){ gMode=b.dataset.gmode; return render(); }
  if(b.dataset.rlv){ rLv=b.dataset.rlv; rShow=40; rOpen=null; return render(); }
  if(b.dataset.rhw){ rHw=b.dataset.rhw; rShow=40; rOpen=null; render(); return scrollTo(0,0); }
  if(b.dataset.ropen){ rOpen=rOpen===b.dataset.ropen?null:b.dataset.ropen; return render(); }
  if(b.dataset.rmore){ rShow+=40; return render(); }
  if(b.dataset.rcab){ $('glPop').hidden=true; markLogsSeen(); tab='guests'; gMode='risk'; rHw=null; rLv='CRITICAL'; rQ=''; rOpen=b.dataset.rcab; render(); const el=document.querySelector(`[data-ropen="${b.dataset.rcab}"]`); if(el) el.scrollIntoView({block:'center'}); return; }
  if(b.dataset.bell){ return logNotify(true); }
  if(b.dataset.glnote==='risk'){ $('glPop').hidden=true; markLogsSeen(); tab='guests'; gMode='risk'; rLv='CH'; rHw=null; render(); return scrollTo(0,0); }
  if(b.dataset.lf){ lF=b.dataset.lf; lOpen=null; return render(); }
  if(b.dataset.lstn!==undefined){ lStn=b.dataset.lstn||null; gMode='log'; lF='all'; lQ=''; lOpen=null; if(!lStn&&lScope==='rank') lScope='mine'; render(); return scrollTo(0,0); }
  if(b.dataset.glnote){ $('glPop').hidden=true; markLogsSeen(); if(b.dataset.glnote==='view'){ tab='guests'; gMode='log'; lScope='mine'; lStn=null; lF='all'; lQ=''; render(); scrollTo(0,0);} return; }
  if(b.dataset.lscope){ lScope=b.dataset.lscope; lOpen=null; return render(); }
  if(b.dataset.lopen){ const i=+b.dataset.lopen; lOpen=lOpen===i?null:i; return render(); }
  if(b.dataset.logcab){ gMode='log'; lQ=b.dataset.logcab; lF='all'; lScope='all'; lOpen=null; render(); return scrollTo(0,0); }
  if(b.dataset.tsort){ teamSort=b.dataset.tsort; return render(); }
  if(b.dataset.ts){ teamScope=b.dataset.ts; return render(); }
  if(b.dataset.tr){ teamRole=b.dataset.tr; return render(); }
  if(b.id==='crewBack'){ tab=prevTab; viewing=null; return render(); }
  if(b.dataset.polpart){ polPart=b.dataset.polpart; return render(); }
  if(b.dataset.polid){ polQ=b.dataset.polid; return render(); }
  if(b.dataset.polwrite){ polGen={...polGen,id:b.dataset.polwrite}; polPart='write'; render(); return scrollTo(0,0); }
  if(b.dataset.pgtype){ polGen={...polGen,type:b.dataset.pgtype}; return render(); }
  if(b.dataset.polcopy){ return polCopy(b.dataset.polcopy); }
  if(b.dataset.polm!==undefined){ polMonth=b.dataset.polm; polSel=null; return render(); }
  if(b.dataset.polr!==undefined){ polRole=b.dataset.polr; return render(); }
  if(b.dataset.polsel!==undefined){ polSel=b.dataset.polsel||null; return render(); }
  if(b.dataset.cday){ pickCompass(b.dataset.cday); return render(); }
  if(b.dataset.hwsort){ hwSort=b.dataset.hwsort; return render(); }
  if(b.dataset.hwview){ hwView=b.dataset.hwview; return render(); }
  if(b.dataset.hwn){ hwN=+b.dataset.hwn; return render(); }
  if(b.dataset.hwv!==undefined){ hwSel=b.dataset.hwv||null; return render(); }
  if(b.dataset.spv){ spQ=''; spKey=b.dataset.spv; ls.set('sp-key',spKey); return render(); }
  if(b.dataset.sppart){ spPart=b.dataset.sppart; return render(); }
  if(b.dataset.spvoy!==undefined){ spVoy=+b.dataset.spvoy; return render(); }
  if(b.dataset.spsort){ spSort=b.dataset.spsort; return render(); }
  if(b.dataset.sprm){ return spRemove(b.dataset.sprm); }
  if(b.id==='publish') return publishAll();
  if(b.id==='resetBtn') return resetPin();
  if(b.id==='asBtn'){ const id=$('asId').value.trim(); const c=(Object.keys(MG.parts).length?previewBuilt():D.built).crew[id]; if(!c){MG.err='Crew ID not found.';return render();} return login(id,true); }
});

document.addEventListener('input',e=>{ const t=e.target; if(t.id==='polQ'||t.id==='spQ'||t.dataset&&t.dataset.pg){ if(t.id==='polQ') polQ=t.value; else if(t.id==='spQ') spQ=t.value; else polGen={...polGen,[t.dataset.pg]:t.value}; const id=t.id, pos=t.selectionStart; render(); const i=$(id); if(i){ i.focus(); try{i.setSelectionRange(pos,pos)}catch(x){} } } });
document.addEventListener('change',e=>{ if(e.target.id==='nightSel'){ mNight=+e.target.value; render(); } });

if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
